# API messages must not depend on the server machine language
quarkus.default-locale=en

# Database: nothing to configure for dev and test. With only the PostgreSQL driver on the classpath and no
# URL, Dev Services starts a throwaway PostgreSQL container and wires the datasource. Setting
# quarkus.datasource.jdbc.url in a profile turns Dev Services OFF for that profile.
# Production connection settings come from the environment: QUARKUS_DATASOURCE_JDBC_URL,
# QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD.

# The schema belongs to Flyway (src/main/resources/db/migration) in EVERY profile, so dev, tests and
# production run the same SQL. Hibernate only checks that the entities match what the migrations built.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Sample data for dev mode only (a repeatable migration in a second location)
%dev.quarkus.flyway.locations=db/migration,db/dev

# Count SQL statements in tests (see QueryCounter)
%test.quarkus.hibernate-orm.statistics=true
