quarkus.default-locale=en

# Files of the classpath that must travel inside the native executable (application.properties and META-INF/resources go by default)
quarkus.native.resources.includes=rates.json

# Image built by the docker extension (only when quarkus.container-image.build=true)
quarkus.container-image.group=lab
quarkus.container-image.name=native-demo
quarkus.container-image.tag=native
quarkus.docker.dockerfile-native-path=src/main/docker/Dockerfile.native-micro
