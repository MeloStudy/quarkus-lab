# Lab 13: cache and scheduled tasks. No database: the "slow upstream" is simulated by RateProvider.

# The "rates" cache: at most 100 entries, each one valid for 5 minutes (the safety net for stale data).
# The test profile shortens the TTL so a test can see an entry expire without waiting minutes.
quarkus.cache.caffeine."rates".maximum-size=100
quarkus.cache.caffeine."rates".expire-after-write=5M
%test.quarkus.cache.caffeine."rates".expire-after-write=1S

# The refresh job: how often it runs and how long the simulated work takes. "off" disables it.
rates.refresh.every=10m
rates.refresh.duration=2s
%test.rates.refresh.every=off

# Upstream latency (per call)
%test.rates.upstream.latency=100ms
