quarkus.default-locale=en

# The carrier. The URL is configuration; the tests get theirs from the stub. A client timeout longer than the
# @Timeout of the service, so that the fault tolerance decides first.
quarkus.rest-client.carrier.url=http://localhost:9090
quarkus.rest-client.carrier.connect-timeout=1000
quarkus.rest-client.carrier.read-timeout=5000

