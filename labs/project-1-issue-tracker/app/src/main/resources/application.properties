# Messages must not depend on the machine language (lab 05)
quarkus.default-locale=en

# Database: nothing to configure in dev and test, Dev Services starts a throwaway PostgreSQL (lab 08).
# Production: QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD.

# The schema belongs to Flyway in every profile; Hibernate only checks that the entities match it (lab 11)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
# Sample data for dev mode only
%dev.quarkus.flyway.locations=db/migration,db/dev

# The JSON contract is strict: a misspelled field is a client bug that must be reported, not ignored (lab 14)
quarkus.jackson.fail-on-unknown-properties=true

# Swagger UI exists in dev and test only (lab 06)
quarkus.swagger-ui.always-include=false

# Count SQL statements in tests (see QueryCounter)
%test.quarkus.hibernate-orm.statistics=true
