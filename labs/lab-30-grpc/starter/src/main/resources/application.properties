quarkus.default-locale=en

# The gRPC server listens on its own port (9000; the tests use 9001), apart from the HTTP port (8080).
# The client in the tests needs no configuration: a client named "catalog" finds the server of the same application.

# Required, no default: the application does not start without it (SRCFG00014). Give it with -Dapp.api-key=... or APP_API_KEY.
%dev.app.api-key=dev-key
%test.app.api-key=test-key

# Lets tools such as grpcurl ask the server which services and methods it has (off by default). Switch it on in dev and
# in the jar tour, decide with the team about production.
%dev.quarkus.grpc.server.enable-reflection-service=true
