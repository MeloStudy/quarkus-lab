// The contract of the catalog service. Quarkus generates the Java classes from this file when you build (target/generated-sources).
// The numbers after "=" identify the fields on the wire: they are the contract, the names are not. Never reuse or renumber one.
syntax = "proto3";

option java_multiple_files = true;
option java_package = "lab.melostudy.grpc";
option java_outer_classname = "CatalogProto";

package catalog;

service Catalog {
  // Unary: one request, one answer.
  rpc GetProduct (GetProductRequest) returns (Product);
  // Server streaming: one request, many answers over time.
  rpc ListProducts (ListProductsRequest) returns (stream Product);
  // Client streaming: many requests, one answer at the end.
  rpc ImportProducts (stream Product) returns (ImportSummary);
}

message GetProductRequest {
  string id = 1;
}

message ListProductsRequest {
  // How many products to stream (1 to 1000).
  int32 count = 1;
}

message Product {
  string id = 1;
  string name = 2;
  int64 price_cents = 3;
}

message ImportSummary {
  int32 imported = 1;
}
