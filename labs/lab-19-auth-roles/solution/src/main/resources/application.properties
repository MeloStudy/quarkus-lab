# Lab 19: authentication and roles
quarkus.default-locale=en

# Authentication mechanism: HTTP Basic (the Authorization header carries "user:password" in base64 - it is NOT
# encryption, so Basic is only acceptable over TLS, lab 22).
quarkus.http.auth.basic=true

# An endpoint without any security annotation is closed (403 for a logged-in user, 401 for an anonymous one).
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Authorization by PATH, in configuration: for what no annotation can reach (here, a static file). Everything under
# /internal/ needs a user or admin role. The check runs before routing, so it applies to paths that do not exist too.
quarkus.http.auth.policy.members.roles-allowed=user,admin
quarkus.http.auth.permission.internal.paths=/internal/*
quarkus.http.auth.permission.internal.policy=members

# USERS: the embedded realm keeps users in this very file. It exists for demos and tests ONLY. There are no users
# in production (profile "prod"): nobody can log in until a real identity provider is configured (labs 20 and 21).
# The passwords below are made-up demo values. (Profiles are listed one by one: "%dev,test." did not work in lab 11.)
%dev.quarkus.security.users.embedded.enabled=true
%dev.quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.alice=alice-pw
%dev.quarkus.security.users.embedded.users.bob=bob-pw
%dev.quarkus.security.users.embedded.users.carol=carol-pw
%dev.quarkus.security.users.embedded.users.dave=dave-pw
%dev.quarkus.security.users.embedded.roles.alice=admin
%dev.quarkus.security.users.embedded.roles.bob=user
%dev.quarkus.security.users.embedded.roles.carol=user
%test.quarkus.security.users.embedded.enabled=true
%test.quarkus.security.users.embedded.plain-text=true
%test.quarkus.security.users.embedded.users.alice=alice-pw
%test.quarkus.security.users.embedded.users.bob=bob-pw
%test.quarkus.security.users.embedded.users.carol=carol-pw
%test.quarkus.security.users.embedded.users.dave=dave-pw
%test.quarkus.security.users.embedded.roles.alice=admin
%test.quarkus.security.users.embedded.roles.bob=user
%test.quarkus.security.users.embedded.roles.carol=user
