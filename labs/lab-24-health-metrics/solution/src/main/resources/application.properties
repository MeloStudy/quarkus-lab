quarkus.default-locale=en

# Task 1: health and metrics live on their own port, not on the public one.
quarkus.management.enabled=true

# A worker that has not gone around its loop for this long is stuck (liveness). The tests use a short time.
app.worker.max-silence-millis=10000
%test.app.worker.max-silence-millis=1000
