quarkus.default-locale=en
quarkus.application.name=payments

# The JSON contract is strict: a misspelled field is a client bug that must be reported, not ignored (lab 14)
quarkus.jackson.fail-on-unknown-properties=true

# --- Security (labs 19, 20) -------------------------------------------------------------------------------------
# Tokens are verified with a public key; only tokens of this issuer and for this API are accepted.
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://payments.example/issuer
mp.jwt.verify.audiences=payments-api
smallrye.jwt.time-to-live=3600
quarkus.native.resources.includes=publicKey.pem
# A closed default: an endpoint nobody annotated answers 403 instead of being open (lab 19)
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# Authenticate when the endpoint needs it, inside the REST layer, instead of before it. Without this a rejected token (401)
# is answered by the HTTP layer, before the request id filter runs, and carries no X-Request-Id (see the review).
quarkus.http.auth.proactive=false
# Test only: where the test helper finds the throw-away private key that signs the tokens (it is not in the jar)
%test.smallrye.jwt.sign.key.location=privateKey.pem

# --- The card provider (labs 02, 07, 22, 23) ---------------------------------------------------------------------
# URL and key come from the environment in production (QUARKUS_REST_CLIENT_PROVIDER_URL, PAYMENTS_PROVIDER_API_KEY).
# The key has no default on purpose: without it the application refuses to start.
quarkus.rest-client.provider.url=http://localhost:9090
quarkus.rest-client.provider.connect-timeout=1000
# Longer than the @Timeout of the gateway, so that the fault tolerance decides first (lab 23)
quarkus.rest-client.provider.read-timeout=5000
%dev.payments.provider.api-key=dev-key-not-a-secret
%test.payments.provider.api-key=test-key-not-a-secret
# The breaker watches the last 20 attempts and stays open for 10 seconds in production (see the annotation); a test cannot wait
# that long or send that many. The unit stays the one of the annotation (seconds): 1 means one second.
%test.quarkus.fault-tolerance."lab.payments.ProviderGateway/charge".circuit-breaker.request-volume-threshold=4
%test.quarkus.fault-tolerance."lab.payments.ProviderGateway/charge".circuit-breaker.delay=1
%test.quarkus.fault-tolerance."lab.payments.ProviderGateway/charge".timeout.value=500

# --- Operations (labs 24, 25) ------------------------------------------------------------------------------------
quarkus.management.enabled=true
# JSON logs in production, text in dev and tests; MDC entries (requestId, traceId...) as top-level fields
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.file.json.mdc.flat-fields=true
# The default span processor sends batches every few seconds; the tests need spans as soon as they end
%test.quarkus.otel.simple=true
