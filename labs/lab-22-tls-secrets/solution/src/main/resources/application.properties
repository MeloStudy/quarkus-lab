quarkus.default-locale=en

app.name=Lab 22

# Task 1: HTTPS. The certificate is a file, the password is never in the repository.
%test.quarkus.tls.key-store.p12.path=target/certs/lab-keystore.p12
%test.quarkus.tls.key-store.p12.password=lab-pw
%dev.quarkus.tls.key-store.p12.path=target/dev-keystore.p12
%dev.quarkus.tls.key-store.p12.password=dev-only-pw
quarkus.http.insecure-requests=redirect

# Task 2: security headers on every response.
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
quarkus.http.header."Content-Security-Policy".value=default-src 'none'; frame-ancestors 'none'
quarkus.http.header."Cache-Control".value=no-store

# Task 3: the API key comes from the environment (APP_API_KEY) in production. Only throw-away values here.
%dev.app.api-key=dev-only-key
%test.app.api-key=test-only-key
