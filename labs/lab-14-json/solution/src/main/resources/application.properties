# The JSON contract of the API is configuration, in one place.

# Property names on the wire: snake_case (guest_name, check_in, ...) whatever the Java names are
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# Strict input: a misspelled or unexpected property is a client error (400), not a silent null
# (Quarkus ignores unknown properties by default)
quarkus.jackson.fail-on-unknown-properties=true

# Dates and times as ISO-8601 text. This is already the Quarkus default; it is written down on purpose.
quarkus.jackson.write-dates-as-timestamps=false
