quarkus.default-locale=en
# Two services on one machine: the inventory service listens on 8081, the orders service on 8080 (when run by hand)
quarkus.http.port=8081
# Do not send null properties: {"error":"UNKNOWN_SKU"} and not {"error":"UNKNOWN_SKU","available":null}
quarkus.jackson.serialization-inclusion=non-null
