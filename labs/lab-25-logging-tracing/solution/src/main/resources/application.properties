quarkus.default-locale=en

# The stock service. The tests start a fake one and override this URL.
quarkus.rest-client.stock.url=http://localhost:9999

# Task 1: machine-readable logs. Text in dev and in the tests, JSON everywhere else (the packaged jar).
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
# The console and the file handler have separate options: the tests read the file, production prints the console.
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.file.json.mdc.flat-fields=true

# Task 4: the name under which this service appears in every trace (the resource attribute service.name).
quarkus.application.name=orders

# The default span processor sends spans in batches every few seconds; the tests need them as soon as they end.
%test.quarkus.otel.simple=true
