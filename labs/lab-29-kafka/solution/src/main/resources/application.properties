quarkus.default-locale=en

# --- Dev Services (dev and tests only): a Kafka broker in a container, started for you -----------------------------
# Pinned on purpose: the default image changes with the Quarkus version. "orders" gets 3 partitions (ordering and groups).
quarkus.kafka.devservices.image-name=docker.io/apache/kafka-native:4.2.0
quarkus.kafka.devservices.topic-partitions."orders"=3

# --- Producer: the door publishes the orders -------------------------------------------------------------------------
mp.messaging.outgoing.orders-out.topic=orders

# --- Consumer 1: shipping (its own consumer group) ---------------------------------------------------------------------
mp.messaging.incoming.shipping.topic=orders
mp.messaging.incoming.shipping.group.id=shipping
# A group that has never committed starts from the beginning (the default, "latest", skips what was published before it joined)
mp.messaging.incoming.shipping.auto.offset.reset=earliest
# A message that fails is not lost and does not stop the consumer: it goes to another topic with the reason in its headers
mp.messaging.incoming.shipping.failure-strategy=dead-letter-queue
mp.messaging.incoming.shipping.dead-letter-queue.topic=orders-dlq
# A record that is not even JSON: without this handler the consumer is stuck on it for ever; with it, it goes to the dead letters too
mp.messaging.incoming.shipping.value-deserialization-failure-handler=order-poison-pill

# --- Consumer 2: audit (another group: it receives every order too) ------------------------------------------------------
mp.messaging.incoming.audit.topic=orders
mp.messaging.incoming.audit.group.id=audit
mp.messaging.incoming.audit.auto.offset.reset=earliest
mp.messaging.incoming.audit.fail-on-deserialization-failure=false

# --- The door ---------------------------------------------------------------------------------------------------------
# How long the door waits for the broker to acknowledge the record (milliseconds)
app.orders.ack-timeout-millis=10000
