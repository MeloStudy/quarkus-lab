quarkus.default-locale=en

# --- Dev Services (dev and tests only): a Kafka broker in a container, started for you -----------------------------
# Pinned on purpose: the default image changes with the Quarkus version. "orders" gets 3 partitions (ordering and groups).
quarkus.kafka.devservices.image-name=docker.io/apache/kafka-native:4.2.0
quarkus.kafka.devservices.topic-partitions."orders"=3

# --- Producer: the door publishes the orders -------------------------------------------------------------------------
# TODO task 1: connect the "orders-out" channel to the topic "orders".

# --- Consumers ----------------------------------------------------------------------------------------------------------
# TODO task 2: connect the channel "shipping" (consumer group "shipping") and the channel "audit" (consumer group "audit")
#   to the topic "orders". A new group must start from the beginning of the topic.
# TODO task 3: decide what happens to a message that fails in "shipping" (not lost, and not stopping the consumer; the
#   dead-letter topic is "orders-dlq"), and what happens to a record that is not JSON ("shipping" must not be stuck on it: use the
#   handler "order-poison-pill"; "audit" must just not fail on it).

# --- The door ---------------------------------------------------------------------------------------------------------
# How long the door waits for the broker to acknowledge the record (milliseconds)
app.orders.ack-timeout-millis=10000
