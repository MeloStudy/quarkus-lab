# The tests share one application and one broker, and a consumer that is stopped by a failure (task 3) stays stopped:
# run the test classes in the order of the tasks, so that a broken task 3 does not turn the task 1 and 2 tests red.
# This file wins over the one inside quarkus-junit (which would order the classes by test profile), so keep its other line.
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
