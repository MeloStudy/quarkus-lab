# Lab 15: HTTP for production. The database needs no configuration in dev and test (Dev Services, lab 08)
# and Hibernate generates the schema there; production schemas belong to migrations (lab 11).
quarkus.default-locale=en

# Where uploaded files are kept (a directory the application owns; production points it at a volume)
docs.storage.dir=${java.io.tmpdir}/docs-storage
%test.docs.storage.dir=target/test-storage

# Upload limits: a body bigger than this is refused with 413 before the application sees it
quarkus.http.limits.max-body-size=1M

# CORS: only the front-end we know, only what it needs. Browsers can read just the response headers listed in
# exposed-headers: without ETag there, a front-end cannot send If-Match.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT
quarkus.http.cors.headers=Content-Type,If-Match,If-None-Match
quarkus.http.cors.exposed-headers=ETag,Location,Content-Disposition
quarkus.http.cors.access-control-max-age=1H

# API version 1 is deprecated: the day it stops working, announced in the Sunset header
api.v1.sunset=Wed, 31 Dec 2027 23:59:59 GMT
