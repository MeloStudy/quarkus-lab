quarkus.default-locale=en

greeting.message=Hello from the jar

# No default: in the packaged application, a missing API_TOKEN stops the startup (dev and tests get a value below)
api.token=${API_TOKEN}
%dev.api.token=dev-token
%test.api.token=test-token

# Used when the image is built by Jib (-Dquarkus.container-image.build=true)
quarkus.container-image.group=lab
quarkus.container-image.name=k8s-demo
quarkus.container-image.tag=1.0
