quarkus.default-locale=en

# Task 1: the service gets its tokens from Keycloak. Dev Services starts it in dev and test
# and imports this realm; in prod you must set quarkus.oidc.auth-server-url yourself.
quarkus.keycloak.devservices.realm-path=lab-realm.json
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.7.4

# Task 3: the token must be meant for this service.
quarkus.oidc.token.audience=notes-service

# Task 4: the "other service" is this application, listening on the test port when testing.
quarkus.rest-client.notes.url=http://localhost:8080
%test.quarkus.rest-client.notes.url=http://localhost:8081
