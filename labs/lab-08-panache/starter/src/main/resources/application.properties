# API messages must not depend on the server machine language
quarkus.default-locale=en

# OpenAPI: a filter that adds the 500 response to every operation
mp.openapi.filter=lab.melostudy.InternalErrorResponseFilter

# REST client "rates" (configKey of RateClient). Everything about the remote service is configuration:
# the URL differs per environment, and the timeouts are a decision, not a default.
# There is deliberately NO url in the default profile: tests get it from the stub (see RatesStubResource)
# and production must set it explicitly, e.g. with QUARKUS_REST_CLIENT_RATES_URL.
%dev.quarkus.rest-client.rates.url=http://localhost:9090
%prod.quarkus.rest-client.rates.url=https://rates.example.com
quarkus.rest-client.rates.connect-timeout=1000
quarkus.rest-client.rates.read-timeout=2000
# Tests wait for the timeout on purpose, so keep it short there
%test.quarkus.rest-client.rates.read-timeout=500

# Database: nothing to configure for dev and test. With only the PostgreSQL driver on the classpath and no
# URL, Dev Services starts a throwaway PostgreSQL container, wires the datasource and lets Hibernate create
# the tables. Setting quarkus.datasource.jdbc.url in a profile turns Dev Services OFF for that profile.
# Production never generates its schema from the entities (migrations do, lab 11). Connection settings come
# from the environment: QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD.
%prod.quarkus.hibernate-orm.schema-management.strategy=none
# Sample data (import.sql) is for dev mode only; tests create their own data
%test.quarkus.hibernate-orm.sql-load-script=no-file
