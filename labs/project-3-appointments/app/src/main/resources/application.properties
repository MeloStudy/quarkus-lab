# Messages must not depend on the machine language (lab 05)
quarkus.default-locale=en

# The clinic: ONE time zone for the whole service (working hours are local times of this zone)
clinic.time-zone=Europe/Madrid
clinic.slot-minutes=15
clinic.horizon-days=90

# Database: Dev Services starts a throwaway PostgreSQL in dev and test (lab 08); the image is pinned (lab 17)
# because the exclusion constraints need the btree_gist extension that this image ships.
quarkus.datasource.devservices.image-name=postgres:17.11
# Production: QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD.

# The schema belongs to Flyway in every profile; Hibernate only checks that the entities match it (lab 11)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
# Sample data for dev mode only
%dev.quarkus.flyway.locations=db/migration,db/dev

# The JSON contract is strict: a misspelled field is a client bug that must be reported, not ignored (lab 14)
quarkus.jackson.fail-on-unknown-properties=true

# Swagger UI exists in dev and test only (lab 06)
quarkus.swagger-ui.always-include=false

# Count SQL statements in tests (see QueryCounter)
%test.quarkus.hibernate-orm.statistics=true

# --- Security (labs 19, 20) -------------------------------------------------------------------------------------
# Tokens are verified with a public key; only tokens of this issuer and for this API are accepted. The roles are the
# "groups" claim: reception, practitioner, patient. A patient token also carries patient_id; a practitioner token, practitioner_id.
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://clinic.example/issuer
mp.jwt.verify.audiences=clinic-api
smallrye.jwt.time-to-live=3600
quarkus.native.resources.includes=publicKey.pem
# A closed default: an endpoint nobody annotated answers 403 instead of being open (lab 19)
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# Test only: where the test helper finds the throw-away private key that signs the tokens (it is not in the jar)
%test.smallrye.jwt.sign.key.location=privateKey.pem

# --- Reminders and the notification provider (labs 7, 13, 22, 23) ---------------------------------------------------
clinic.reminders.poll-interval=30s
# URL and key come from the environment in production (QUARKUS_REST_CLIENT_NOTIFICATIONS_URL, NOTIFICATIONS_API_KEY).
# The key has no default on purpose: without it the application refuses to start.
quarkus.rest-client.notifications.url=http://localhost:9090
quarkus.rest-client.notifications.connect-timeout=1000
# Longer than the @Timeout of the gateway, so that the fault tolerance decides first (lab 23)
quarkus.rest-client.notifications.read-timeout=5000
%dev.notifications.api-key=dev-key-not-a-secret
%test.notifications.api-key=test-key-not-a-secret
# The tests call the job by hand and decide when time passes: the real clock of the scheduler must not interfere
%test.clinic.reminders.poll-interval=1h
# The breaker watches the last 10 attempts and stays open for 10 seconds in production (see the annotation); a test cannot wait
# that long or send that many. The unit stays the one of the annotation (seconds): 1 means one second.
%test.quarkus.fault-tolerance."lab.clinic.ReminderGateway/send".circuit-breaker.request-volume-threshold=4
%test.quarkus.fault-tolerance."lab.clinic.ReminderGateway/send".circuit-breaker.delay=1
%test.quarkus.fault-tolerance."lab.clinic.ReminderGateway/send".timeout.value=500

# --- Operations (labs 24, 25) ------------------------------------------------------------------------------------
quarkus.application.name=clinic
# Health and metrics live on their own port (9000; 9001 in tests), not on the public API
quarkus.management.enabled=true
# JSON logs in production, text in dev and tests; MDC entries (reminderId, traceId...) as top-level fields
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.mdc.flat-fields=true
quarkus.log.file.json.mdc.flat-fields=true
# The default span processor sends batches every few seconds; the tests need spans as soon as they end
%test.quarkus.otel.simple=true

# --- Container and Kubernetes (labs 33, 35) ----------------------------------------------------------------------
quarkus.container-image.group=lab
quarkus.container-image.name=clinic
quarkus.container-image.tag=1.0

# The image is built locally (Jib, lab 33) and exists only in the Docker of the machine: do not ask a registry for it (lab 35)
quarkus.kubernetes.image-pull-policy=IfNotPresent
# A build timestamp in the pod template makes every build a rollout, and the version in the selector breaks the next apply (lab 35)
quarkus.kubernetes.add-build-timestamp=false
quarkus.kubernetes.add-version-to-label-selectors=false
# A ServiceMonitor needs the CRD of the Prometheus operator; a cluster without it refuses the whole file
quarkus.kubernetes.prometheus.generate-service-monitor=false
# Configuration and secrets arrive from the cluster, never from the image (labs 22, 35): the names are the contract with the operator
quarkus.kubernetes.env.configmaps=clinic-config
quarkus.kubernetes.env.secrets=clinic-secret
quarkus.kubernetes.resources.requests.memory=192Mi
quarkus.kubernetes.resources.requests.cpu=100m
quarkus.kubernetes.resources.limits.memory=384Mi
