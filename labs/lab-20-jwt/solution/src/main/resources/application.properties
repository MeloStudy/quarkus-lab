quarkus.default-locale=en

# Task 1: where the public key is and who must have issued the token.
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://lab.example/issuer
quarkus.native.resources.includes=publicKey.pem

# Task 5: the token must be meant for this API and may not live too long.
mp.jwt.verify.audiences=notes-api
smallrye.jwt.time-to-live=3600

# Test only: where the test helper finds the private key that signs the tokens.
%test.smallrye.jwt.sign.key.location=privateKey.pem
