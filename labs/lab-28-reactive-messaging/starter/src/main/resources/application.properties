quarkus.default-locale=en

# How long the door waits for the pipeline to acknowledge or reject an order (milliseconds)
app.orders.ack-timeout-millis=5000

# Tests: a pipeline that never answers must be noticed in 1.5 s, not in 5
%test.app.orders.ack-timeout-millis=1500

# How long a call to the (simulated) warehouse driver takes, in milliseconds
app.warehouse.delay-millis=20
