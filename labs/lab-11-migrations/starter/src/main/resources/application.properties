# API messages must not depend on the server machine language
quarkus.default-locale=en

# Database: nothing to configure for dev and test. With only the PostgreSQL driver on the classpath and no
# URL, Dev Services starts a throwaway PostgreSQL container, wires the datasource and lets Hibernate create
# the tables. Setting quarkus.datasource.jdbc.url in a profile turns Dev Services OFF for that profile.
# Production connection settings come from the environment: QUARKUS_DATASOURCE_JDBC_URL,
# QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD.

# TODO (lab 11): today Hibernate builds the schema from the entities in dev and test, and nothing builds it in
# production. Flyway should own the schema in EVERY profile: configure it and replace these two lines.
# (The explicit dev/test line is only here because, with the Flyway extension on the classpath, the default
# is no longer "generate the schema".)
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=none
# Sample data (import.sql) is for dev mode only; tests create their own data
%test.quarkus.hibernate-orm.sql-load-script=no-file

# Count SQL statements in tests (see QueryCounter)
%test.quarkus.hibernate-orm.statistics=true
