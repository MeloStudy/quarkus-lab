quarkus.default-locale=en

# Where the exchange rates come from. The default is a port nobody listens on: a test that does not provide a
# server for it gets 503, exactly as it would on a machine without network. Production sets RATES_URL.
rates.url=http://localhost:9

# Strict mode: a currency pair without a fee entry is refused (422) instead of converted with no fee.
app.strict=false

# Dev Services (dev mode and tests): the same PostgreSQL major version as production, and the fee table.
quarkus.datasource.devservices.image-name=postgres:17.11
quarkus.datasource.devservices.init-script-path=dev-services/fees.sql
