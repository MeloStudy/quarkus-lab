quarkus.default-locale=en

# Listens on the loopback only; the reverse proxy of the same machine forwards the requests to it
quarkus.http.host=localhost
# Since 3.38 a request whose Host header is not a localhost name is refused (400) when the host is localhost:
# the reverse proxy forwards the public name, so say which ones are expected (and keep localhost: with this property
# set, only the listed names are accepted, localhost included)
quarkus.http.host-validation.allowed-hosts=tickets.example.com,localhost

# Logging: the names that survive Quarkus 4
quarkus.log.console.enabled=true
quarkus.log.console.async.enabled=false
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
